<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | Brandify Admin</title><link rel="stylesheet" href="css/admin-product-form.css"></head><body class="admin-body"><div class="admin-layout"><div data-admin-shell><div class="admin-page-heading"><div><h1 id="formTitle">Add product</h1><p>Product updates are shared with the creator catalog.</p></div></div><form id="productForm"><section class="admin-panel"><h2>Basic information</h2><div class="admin-form-grid"><label class="admin-field">Product name<input name="name" required></label><label class="admin-field">Category<select name="category" id="formCategory" required></select></label><label class="admin-field full">Description<textarea name="description"></textarea></label></div></section><section class="admin-panel"><h2>Media</h2><div class="admin-form-grid"><label class="admin-field">Main image<input type="file" id="imageUpload" accept="image/*"><small>Or select an existing Brandify catalog image below.</small></label><div class="admin-field"><span>Selected image</span><img id="imagePreview" alt="Product preview" style="width:110px;height:90px;object-fit:cover;border-radius:9px"></div><div class="admin-field full"><span>Additional images</span><div class="admin-image-options" id="imageChoices"></div></div></div></section><section class="admin-panel"><h2>Pricing & inventory</h2><div class="admin-form-grid"><label class="admin-field">Base price (₹)<input name="basePrice" type="number" min="0" step="0.01"></label><label class="admin-field">Stock quantity<input name="stock" type="number" min="0" step="1" value="0" required></label><label class="admin-field">Low stock threshold<input name="lowStockThreshold" type="number" min="0" step="1" value="5"></label><label class="admin-field">Status<select name="status"><option>Active</option><option>Inactive</option><option>Archived</option></select></label></div></section><section class="admin-panel"><h2>Variants</h2><div class="admin-form-grid"><label class="admin-field">Sizes <small>Separate values with commas</small><input name="sizes" placeholder="e.g. S, M, L"></label><label class="admin-field">Colors <small>Separate values with commas</small><input name="colors" placeholder="e.g. Black, Natural"></label></div></section><section class="admin-panel"><h2>Product details</h2><p class="admin-muted" id="detailHint">Choose a category to see its relevant detail fields.</p><div class="admin-form-grid" id="dynamicDetails"></div></section><section class="admin-panel"><h2>Customization</h2><div class="admin-checks"><label><input type="checkbox" name="privateLabel"> Private label</label><label><input type="checkbox" name="customPackaging"> Custom packaging</label><label><input type="checkbox" name="printDesign"> Print design</label><label><input type="checkbox" name="embroidery"> Embroidery</label></div></section><div class="admin-form-actions"><a class="admin-button" href="admin-products.html">Cancel</a><button class="admin-button primary" id="saveProduct" type="submit">Save product</button></div></form></div></div><script src="js/product-catalog.js"></script><script src="js/admin-data.js"></script><script src="js/admin-auth.js"></script><script src="js/admin-shell.js"></script><script src="js/admin-product-form.js"></script></body></html>
