<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings | Brandify Admin</title><link rel="stylesheet" href="css/admin-settings.css"></head><body class="admin-body"><div class="admin-layout"><div data-admin-shell><div class="admin-page-heading"><div><h1>Settings</h1><p>Manage this browser's demo admin profile and credentials.</p></div></div><form id="adminSettingsForm"><section class="admin-panel"><h2>Admin profile</h2><div class="admin-form-grid"><label class="admin-field">Display name<input name="name" id="adminName"></label><label class="admin-field">Admin email<input name="email" id="adminEmail" type="email" required></label></div></section><section class="admin-panel"><h2>Security</h2><div class="admin-form-grid"><label class="admin-field full">Current password<input name="currentPassword" type="password" autocomplete="current-password"></label><label class="admin-field">New password<input name="newPassword" type="password" autocomplete="new-password"></label><label class="admin-field">Confirm new password<input name="confirmPassword" type="password" autocomplete="new-password"></label></div><p class="admin-muted">Credentials are stored in localStorage for this frontend prototype.</p></section><div class="admin-form-actions"><button class="admin-button primary" type="submit">Save settings</button></div></form></div></div><script src="js/admin-data.js"></script><script src="js/admin-auth.js"></script><script src="js/admin-shell.js"></script><script src="js/admin-settings.js"></script></body></html>
